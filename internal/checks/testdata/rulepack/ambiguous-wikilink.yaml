check: ambiguous-wikilink
on:
  - "wiki/**"
  - "!wiki/outbox/**"
  - "!wiki/sources/**"
severity: warn
message: "ambiguous wikilink [[{{.Target}}]] resolves to {{.Count}} files: {{.Paths}}"
roots:
  - "wiki/**"
  - "!wiki/outbox/**"
  - "!wiki/sources/**"
skip-prefixes:
  - "inbox/"
  - ".repos/"
  - "http"
