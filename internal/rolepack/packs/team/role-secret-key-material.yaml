# Team pack — secrets are blocked at this boundary (contract C45).
check: pattern
on: ["**"]
severity: error
target: content
match: "-----BEGIN [A-Z0-9 ]*PRIVATE KEY-----|AGE-SECRET-KEY-1[0-9A-Z]{58}"
message: "secret: private key material ({{.Match}}) — this repo's role blocks secrets; move it to the -secrets companion (role: private)"
