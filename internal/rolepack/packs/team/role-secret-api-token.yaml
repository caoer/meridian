# Team pack — secrets are blocked at this boundary (contract C45).
# High-confidence prefixed token shapes only: generic key=value sniffing
# drowns a wiki that documents configuration in false positives.
check: pattern
on: ["**"]
severity: error
target: content
match: "\\bgh[pousr]_[A-Za-z0-9]{36,}\\b|\\bxox[baprs]-[0-9A-Za-z-]{10,}\\b|\\bsk-ant-[A-Za-z0-9_-]{20,}\\b"
message: "secret: API token ({{.Match}}) — this repo's role blocks secrets; move it to the -secrets companion (role: private)"
