# Team pack — secrets are blocked at this boundary (contract C45).
check: pattern
on: ["**"]
severity: error
target: content
match: "\\bAKIA[0-9A-Z]{16}\\b|\\bAIza[0-9A-Za-z_-]{35}\\b"
message: "secret: cloud credential ({{.Match}}) — this repo's role blocks secrets; move it to the -secrets companion (role: private)"
