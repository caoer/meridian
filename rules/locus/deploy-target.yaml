property: deploy-target
on: "wiki/outbox/**"
severity: error
message: "Invalid deploy target: {{.Reason}}"
wikilink:
  link_display:
    template:
      - when: ".repos/**"
        format: "{{.Target | trimPrefix \".repos/\"}}"
      - when: ".dist/**"
        format: "{{.Target | trimPrefix \".dist/\"}}"
      - when: ".claude/**"
        format: "{{.Target | trimPrefix \".claude/\"}}"
