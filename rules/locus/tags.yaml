property: tags
on:
  - "wiki/**"
  # Generated files are machine-written; hand-editing them is false-success.
  - "!wiki/**/*.generated.md"
  # Obsidian Kanban boards (kanban-plugin: board) are UI artifacts, not knowledge
  # pages. on: can't filter on frontmatter, so the two boards are excluded by path.
  - "!wiki/markup/network-ip-ranges.md"
  - "!wiki/outbox/markup/credential-book-xrefs/decision.md"
required: true
severity: warn
message: "Missing or invalid tags"
tag:
  prefix:
    in: [domain, type, status, topic, meta, project,
         harvest-source, source, use, do, role, session, agent,
         convention, has, plugin, round, priority]
