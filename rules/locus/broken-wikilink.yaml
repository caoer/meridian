check: broken-wikilink
on: "wiki/**"
not-on:
  - "wiki/outbox/starters/**"
  - "wiki/outbox/agents/**"
  - "wiki/outbox/skills/locus-cloudflare/skills/**"
severity: warn
message: "Broken wikilink: [[{{.Target}}]]"
params:
  roots: ["wiki/**"]
  skip-prefixes:
    - "inbox/"
    - ".repos/"
    - "http"
