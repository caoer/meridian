check: broken-wikilink
on:
  - "wiki/**"
  - "!wiki/outbox/starters/**"
  - "!wiki/outbox/agents/**"
  - "!wiki/outbox/skills/locus-cloudflare/skills/**"
  - "!wiki/sources/**"
severity: warn
message: "{{.Type}} wikilink: [[{{.Target}}]]"
roots: ["wiki/**"]
skip-prefixes:
  - "inbox/"
  - ".repos/"
  - "http"
