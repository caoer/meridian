name: perf

# Performance regression gate for `md check`.
#
# Strategy (shared runners are 2-3x noisy, so absolute time budgets are
# useless — both signals below are runner-speed-invariant):
#
#   1. Ratio vs merge-base: build md from the PR head AND from the merge-base,
#      run both against the SAME generated corpus on the SAME runner, fail on
#      >1.3x slowdown. Noise cancels in the ratio.
#   2. Scaling slope: time must grow ~linearly with doc count. small (1k) vs
#      medium (10k) is a 10x size step; a slope beyond 25x means superlinear
#      (O(n^2)) work crept in — caught with no baseline at all.
#
# The corpus is generated, not stored: test/perf/gen is seeded and
# deterministic, so "the golden dataset" is (generator code, seed, size) —
# reviewable in diffs, no artifact hosting. Sizes are parameters; the nightly
# large tier runs 100k docs.
#
# Two more tiers guard the persistent fact cache (the two-phase engine's warm
# path). The cache serves phase-1 (pure-doc) facts+findings; phase-2 (the link
# family and the whole effect-pin family) is recomputed every run and never
# cached, so the honesty gate below verifies phase-1 integrity only.
#
#   3. PR-tier verify sample: every PR runs one MD_CACHE_VERIFY=1 pass on the
#      head binary — serve from the warm cache, recompute the same corpus with no
#      cache, and diff. A divergence means the cache served a result a cold run
#      does not reproduce (exit 2 => PR fails). Cheap; runs on the medium corpus
#      already benched, so the cache is warm. entries_checked>0 is asserted so a
#      cold cache can't pass the gate vacuously.
#   4. Nightly wiki-corpus tier: a home-wiki-SHAPED ×N corpus (fixture git repos
#      + vendored 3-pack rules + effect pins + .runs.md sidecars — self-contained,
#      built by test/perf/gen -profile wiki, no external state) exercised with
#      MD_CACHE_VERIFY=1 as the cache honesty gate at wiki scale. Nightly + on
#      demand (workflow_dispatch). Failure posture: a failed scheduled run
#      surfaces via GitHub's standard workflow-failure notification, same as the
#      `large` nightly tier — no bespoke alerting.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *" # nightly large tier
  workflow_dispatch:
    inputs:
      docs:
        description: "corpus size (docs) for the large run"
        default: "100000"
      wiki_mult:
        description: "wiki-corpus multiplier (docs = mult*3827; 10 ~= 38k)"
        default: "10"

permissions:
  contents: read
  actions: read # chart.sh downloads perf-metrics artifacts from previous runs

env:
  SEED: 1
  RATIO_MAX_PCT: 130 # fail PR if head > 1.3x merge-base
  SLOPE_MAX: 25      # fail if time(10x docs) > 25x time(1x docs)

jobs:
  regression:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build head binary
        run: go build -o /tmp/md-head ./cmd/md

      - name: Build baseline binary (merge-base with main)
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=$(git merge-base origin/${{ github.base_ref }} HEAD)
          else
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          git worktree add /tmp/base "$BASE"
          cd /tmp/base && go build -o /tmp/md-base ./cmd/md

      - name: Generate corpora (head generator, both binaries share them)
        run: |
          go run ./test/perf/gen -out /tmp/corpus-small  -docs 1000  -seed "$SEED" -rules ./rules
          go run ./test/perf/gen -out /tmp/corpus-medium -docs 10000 -seed "$SEED" -rules ./rules

      - name: Bench
        id: bench
        run: |
          small_head=$(./test/perf/bench.sh /tmp/md-head /tmp/corpus-small)
          med_head=$(./test/perf/bench.sh /tmp/md-head /tmp/corpus-medium)
          med_base=$(./test/perf/bench.sh /tmp/md-base /tmp/corpus-medium)
          echo "small_head=$small_head" >> "$GITHUB_OUTPUT"
          echo "med_head=$med_head"     >> "$GITHUB_OUTPUT"
          echo "med_base=$med_base"     >> "$GITHUB_OUTPUT"
          {
            echo "### md check perf (min of 3 runs)"
            echo ""
            echo "| corpus | head | baseline (${{ steps.base.outputs.sha }}) |"
            echo "|---|---|---|"
            echo "| small (1k docs) | ${small_head}ms | — |"
            echo "| medium (10k docs) | ${med_head}ms | ${med_base}ms |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write metrics artifact (queryable history, one JSON per run)
        run: |
          jq -n --argjson run "$GITHUB_RUN_NUMBER" \
                --arg sha "$GITHUB_SHA" \
                --argjson small "${{ steps.bench.outputs.small_head }}" \
                --argjson medium "${{ steps.bench.outputs.med_head }}" \
                '{run: $run, sha: $sha, small_ms: $small, medium_ms: $medium}' \
            > /tmp/perf.json

      - uses: actions/upload-artifact@v7
        with:
          name: perf-metrics
          path: /tmp/perf.json

      - name: Trend chart (last 20 main runs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./test/perf/chart.sh "$GITHUB_RUN_NUMBER" "${{ steps.bench.outputs.med_head }}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: "Gate: ratio vs baseline (medium corpus)"
        run: |
          head=${{ steps.bench.outputs.med_head }}
          base=${{ steps.bench.outputs.med_base }}
          # Sub-100ms baselines are dominated by fixed overhead; skip ratio.
          if [ "$base" -lt 100 ]; then
            echo "baseline ${base}ms too small for a stable ratio — skipping"
            exit 0
          fi
          if [ $((head * 100)) -gt $((base * RATIO_MAX_PCT)) ]; then
            echo "::error::md check regressed: ${head}ms vs baseline ${base}ms (> ${RATIO_MAX_PCT}% allowed)"
            exit 1
          fi
          echo "ratio OK: ${head}ms vs ${base}ms"

      - name: "Gate: scaling slope (1k -> 10k docs)"
        run: |
          small=${{ steps.bench.outputs.small_head }}
          med=${{ steps.bench.outputs.med_head }}
          [ "$small" -lt 1 ] && small=1
          slope=$((med / small))
          if [ "$slope" -gt "$SLOPE_MAX" ]; then
            echo "::error::superlinear scaling: 10x docs took ${slope}x time (${small}ms -> ${med}ms, max ${SLOPE_MAX}x)"
            exit 1
          fi
          echo "slope OK: 10x docs -> ${slope}x time (${small}ms -> ${med}ms)"

      # Sampled cache-honesty check (plan §7 U9): one MD_CACHE_VERIFY=1 pass on the
      # head binary. The Bench step above already ran md-head over the medium corpus,
      # so its persistent cache is warm; verify recomputes on hit and diffs. Exit 2
      # (=> non-empty step, set -e fails) means the warm cache is dishonest.
      - name: "Gate: cache honesty (verify sample, head @ medium corpus)"
        run: |
          cd /tmp/corpus-medium
          # ensure the cache is warm (findings are expected — corpus violates rules on purpose)
          /tmp/md-head check >/dev/null 2>&1 || true
          rc=0
          out=$(MD_CACHE_VERIFY=1 /tmp/md-head check '{"format":"json"}') || rc=$?
          echo "$out" | jq '.data | {verified, entries_checked, divergences: (.divergences | length)}'
          verified=$(echo "$out" | jq -r '.data.verified')
          checked=$(echo "$out" | jq -r '.data.entries_checked')
          if [ "$rc" -ne 0 ] || [ "$verified" != "true" ]; then
            echo "::error::cache verify divergence — warm cache served a result a cold recompute does not reproduce"
            echo "$out" | jq '.data.divergences'
            exit 1
          fi
          if [ "${checked:-0}" -lt 1 ]; then
            echo "::error::verify sample vacuous — 0 cache entries checked (cache failed to warm)"
            exit 1
          fi
          echo "verify sample OK: ${checked} entries checked, no divergence"

  large:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o /tmp/md-head ./cmd/md

      - name: Generate corpora
        run: |
          DOCS="${{ github.event.inputs.docs || '100000' }}"
          go run ./test/perf/gen -out /tmp/corpus-medium -docs 10000 -seed "$SEED" -rules ./rules
          go run ./test/perf/gen -out /tmp/corpus-large -docs "$DOCS" -seed "$SEED" -rules ./rules

      - name: Bench + slope gate (10k -> large)
        run: |
          DOCS="${{ github.event.inputs.docs || '100000' }}"
          med=$(./test/perf/bench.sh /tmp/md-head /tmp/corpus-medium)
          large=$(./test/perf/bench.sh /tmp/md-head /tmp/corpus-large)
          {
            echo "### md check perf — large tier"
            echo ""
            echo "| corpus | time |"
            echo "|---|---|"
            echo "| medium (10k docs) | ${med}ms |"
            echo "| large ($DOCS docs) | ${large}ms |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$med" -lt 1 ] && med=1
          slope=$((large / med))
          size_ratio=$((DOCS / 10000))
          max=$((size_ratio * 5 / 2)) # allow 2.5x superlinearity slack
          if [ "$slope" -gt "$max" ]; then
            echo "::error::superlinear scaling at large tier: ${size_ratio}x docs took ${slope}x time (${med}ms -> ${large}ms, max ${max}x)"
            exit 1
          fi
          echo "slope OK: ${size_ratio}x docs -> ${slope}x time"

  # Nightly wiki-corpus tier: the persistent cache's honesty gate at wiki scale.
  #
  # Runtime budget (measured, results/u1-baseline.md on an M4 Max): corpus +
  # fixture-repo generation ~11s locally; a cold `md check` over the ×10 corpus
  # (~38k docs) ~15s. GitHub-hosted runners are ~2-3x slower, so budget ~30-60s
  # for generation and a couple of minutes wall-clock for the whole job. The
  # corpus is self-contained (fixture git repos + vendored 3-pack rules), so the
  # runner needs no external state — only git, which ubuntu-latest ships.
  #
  # Failure posture: a failed scheduled run surfaces via GitHub's standard
  # workflow-failure notification, identical to the `large` nightly tier.
  wiki-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build -o /tmp/md-head ./cmd/md

      - name: Generate ×N wiki-profile corpus (self-contained fixtures + vendored packs)
        run: |
          MULT="${{ github.event.inputs.wiki_mult || '10' }}"
          # Generator writes progress to stderr and `export CCC_LLM_WIKI_REPOS_ROOT=…`
          # as its final stdout line — effect-pin rules silently no-op without it.
          go run ./test/perf/gen -profile wiki -out /tmp/wiki -mult "$MULT" -seed "$SEED" \
            | tee /tmp/wikigen.out
          root=$(grep '^export CCC_LLM_WIKI_REPOS_ROOT=' /tmp/wikigen.out | tail -1 | cut -d= -f2-)
          if [ -z "$root" ]; then
            echo "::error::generator did not print CCC_LLM_WIKI_REPOS_ROOT"
            exit 1
          fi
          echo "CCC_LLM_WIKI_REPOS_ROOT=$root" >> "$GITHUB_ENV"

      - name: Warm cache + timing summary
        run: |
          # Run 1 builds the persistent cache (cold); min-of-3 self-warms (min = warm).
          warm=$(./test/perf/bench.sh /tmp/md-head /tmp/wiki 3)
          {
            echo "### md check — wiki-profile ×${{ github.event.inputs.wiki_mult || '10' }} corpus"
            echo ""
            echo "| corpus | warm (min of 3) |"
            echo "|---|---|"
            echo "| wiki-profile | ${warm}ms |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Gate: cache honesty (MD_CACHE_VERIFY on warm wiki corpus)"
        run: |
          cd /tmp/wiki
          # Cache is warm from the timing step; recompute-on-hit and diff.
          rc=0
          out=$(MD_CACHE_VERIFY=1 /tmp/md-head check '{"format":"json"}') || rc=$?
          echo "$out" | jq '.data | {verified, entries_checked, divergences: (.divergences | length)}'
          verified=$(echo "$out" | jq -r '.data.verified')
          checked=$(echo "$out" | jq -r '.data.entries_checked')
          if [ "$rc" -ne 0 ] || [ "$verified" != "true" ]; then
            echo "::error::cache divergence at wiki scale — warm cache is dishonest"
            echo "$out" | jq '.data.divergences'
            exit 1
          fi
          if [ "${checked:-0}" -lt 1 ]; then
            echo "::error::verify vacuous — 0 cache entries checked (cache failed to warm)"
            exit 1
          fi
          echo "cache honest at wiki scale: ${checked} entries checked, no divergence"
